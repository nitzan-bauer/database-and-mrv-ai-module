name: Weekly Verra webinar recording scan

# Runs on GitHub's own runners, not an Anthropic cloud routine — confirmed
# live 2026-08-25 that the cloud-routine sandbox's fixed network-egress
# allowlist blocks verra.org, api.groq.com, and this repo's own Vercel API,
# with no way to add exceptions. GitHub Actions has unrestricted egress.

on:
  schedule:
    # Saturday 06:00 UTC = 09:00 Israel (IDT) — two days after the existing
    # Thursday written-recap scan, giving Verra time to post the recording.
    - cron: '0 6 * * 6'
  workflow_dispatch: {}

jobs:
  scan:
    name: Transcribe and summarize new VM0042/ALM recordings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # yt-dlp needs a JS runtime to solve YouTube's "n challenge" (signature
      # obfuscation) — confirmed live 2026-09-02: without this, yt-dlp fails
      # every YouTube download with "n challenge solving failed" even once
      # cookies solve the separate bot-detection block. yt-dlp's EJS solver
      # looks for Deno specifically, not plain Node.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -U yt-dlp

      # Optional, not required to run the scan: if a YT_COOKIES secret ever
      # gets added (see the step-by-step instructions the scan itself emails
      # when YouTube blocks a download as a bot), this writes it out so
      # scripts/webinar-recording-scan.mjs picks it up automatically via
      # YT_COOKIES_PATH — no further workflow change needed at that point.
      # GitHub Actions won't allow `secrets` directly inside a step's `if:` —
      # always run the step, but no-op when the secret hasn't been set.
      - name: Write YouTube cookies, if provided
        run: '[ -n "$YT_COOKIES" ] && printf "%s" "$YT_COOKIES" > /tmp/yt-cookies.txt || echo "no YT_COOKIES secret set — skipping"'
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: Run scan
        working-directory: web
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTERNAL_AGENT_SECRET: ${{ secrets.EXTERNAL_AGENT_SECRET }}
        run: node scripts/webinar-recording-scan.mjs
